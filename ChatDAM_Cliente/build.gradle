plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

group = 'es.damdi.alberto'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Librería para mapear objetos a JSON en las peticiones HTTP
    implementation 'com.google.code.gson:gson:2.10.1'
}

javafx {
    version = '17'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'es.damdi.alberto.chatdam_cliente.Launcher'
}